<h2 mat-dialog-title>{{ data.title || 'Temporary password ready' }}</h2>
<mat-dialog-content>
  <p>
    Share this temporary password securely with <strong>{{ data.username }}</strong>.
    It will not be shown again after this window is closed.
  </p>

  <div class="password-value" aria-label="Temporary password">
    <code>{{ data.temporaryPassword }}</code>
    <button mat-stroked-button type="button" (click)="copyPassword()">
      {{ copied() ? 'Copied' : 'Copy password' }}
    </button>
  </div>

  <p class="security-note">
    The user will be required to choose a new password when they next sign in.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button type="button" mat-dialog-close>Done</button>
</mat-dialog-actions>
