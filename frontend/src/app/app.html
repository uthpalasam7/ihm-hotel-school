<div class="app-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="brand" href="/" aria-label="IHM Hotel School home">
      <img src="/assets/branding/ihm-logo.jpg" alt="IHM Hotel School logo" />
      <span>IHM Hotel School</span>
    </a>

    <nav>
      @for (item of navigationItems; track item) {
        <a href="/" [class.is-active]="item === 'Dashboard'">{{ item }}</a>
      }
    </nav>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">IHM-MAIN</p>
        <h1>Management Console</h1>
      </div>
      <div class="operator">
        <span class="operator-label">Phase 1</span>
        <strong>Foundation</strong>
      </div>
    </header>

    <section class="status-grid" aria-label="Foundation status">
      @for (item of statusItems; track item.label) {
        <article class="status-card">
          <span>{{ item.label }}</span>
          <strong>{{ item.value }}</strong>
        </article>
      }
    </section>

    <section class="work-panel" aria-labelledby="workspace-heading">
      <div>
        <p class="eyebrow">Default Branch</p>
        <h2 id="workspace-heading">IHM Hotel School</h2>
      </div>
      <p class="branch-code">IHM-MAIN</p>
    </section>
  </main>
</div>
