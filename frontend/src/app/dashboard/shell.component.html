<div class="app-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <a class="brand" routerLink="/" aria-label="IHM Hotel School home">
      <img src="/assets/branding/ihm-logo.jpg" alt="IHM Hotel School logo" />
      <span>IHM Hotel School</span>
    </a>

    <nav>
      @for (item of visibleNavigation(); track item.label) {
        <a [routerLink]="item.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: item.path === '/' }">{{ item.label }}</a>
      }
    </nav>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <div>
        <div class="branch-control">
          @if (canSwitchBranch()) {
            <label>
              <span class="eyebrow">Active branch</span>
              <select [ngModel]="activeBranch()?.id" (ngModelChange)="changeBranch($event)" aria-label="Active branch">
                @for (branch of availableBranches(); track branch.id) {
                  <option [value]="branch.id">{{ branch.code }} - {{ branch.name }}</option>
                }
              </select>
            </label>
          } @else {
            <p class="eyebrow">Active branch</p>
            <strong class="branch-display">{{ branchLabel() }}</strong>
          }
        </div>
        <h1>Management Console</h1>
      </div>
      <div class="operator">
        <span class="operator-label">{{ user()?.fullName }}</span>
        <strong>{{ user()?.roles?.join(', ') }}</strong>
        <a routerLink="/change-password">Change password</a>
        <button type="button" (click)="logout()">Logout</button>
      </div>
    </header>

    <router-outlet />
  </main>
</div>
