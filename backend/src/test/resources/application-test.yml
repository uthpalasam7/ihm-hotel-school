spring:
  datasource:
    url: jdbc:h2:mem:ihm_hotel_school_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt-secret: test-development-placeholder-change-before-production-64-characters
    access-token-minutes: 15
    refresh-token-days: 30
    max-failed-login-attempts: 5
    failed-login-lock-minutes: 15
  initial-admin:
    username:
    password:
    full-name: Initial Super Administrator
    email:
  student-photo:
    storage-path: ${java.io.tmpdir}/ihm-hotel-school-test-student-photos
    max-size: 5MB

debug: false

logging:
  level:
    root: INFO
