spring:
  application:
    name: ihm-hotel-school
  datasource:
    url: ${IHM_DB_URL:jdbc:postgresql://localhost:5432/ihm_hotel_school}
    username: ${IHM_DB_USERNAME:ihm_app}
    password: ${IHM_DB_PASSWORD:change-me-local-only}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${IHM_STUDENT_PHOTO_MAX_SIZE:5MB}
      max-request-size: ${IHM_STUDENT_PHOTO_MAX_REQUEST_SIZE:6MB}

server:
  port: ${IHM_BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  timezone: ${IHM_APP_TIMEZONE:Asia/Colombo}
  currency-code: ${IHM_APP_CURRENCY:LKR}
  security:
    jwt-secret: ${IHM_JWT_SECRET:local-development-placeholder-change-before-production-64-characters}
    access-token-minutes: ${IHM_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${IHM_REFRESH_TOKEN_DAYS:30}
    max-failed-login-attempts: ${IHM_MAX_FAILED_LOGIN_ATTEMPTS:5}
    failed-login-lock-minutes: ${IHM_FAILED_LOGIN_LOCK_MINUTES:15}
  initial-admin:
    username: ${IHM_INITIAL_ADMIN_USERNAME:}
    password: ${IHM_INITIAL_ADMIN_PASSWORD:}
    full-name: ${IHM_INITIAL_ADMIN_FULL_NAME:Initial Super Administrator}
    email: ${IHM_INITIAL_ADMIN_EMAIL:}
  student-photo:
    storage-path: ${IHM_STUDENT_PHOTO_STORAGE_PATH:./data/student-photos}
    max-size: ${IHM_STUDENT_PHOTO_MAX_SIZE:5MB}
