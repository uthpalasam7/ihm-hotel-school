services:
  postgres:
    image: postgres:17-alpine
    container_name: ihm-hotel-school-postgres
    environment:
      POSTGRES_DB: ${IHM_DB_NAME:-ihm_hotel_school}
      POSTGRES_USER: ${IHM_DB_USERNAME:-ihm_app}
      POSTGRES_PASSWORD: ${IHM_DB_PASSWORD:-change-me-local-only}
    ports:
      - "${IHM_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
